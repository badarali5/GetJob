spring.application.name=GetJob

# Database configuration - can be overridden by environment variables
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/getjobdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:badar512}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Run backend on a non-conflicting port when running the Vite dev server on 8080
server.port=8081

# JWT configuration
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsLongEnough}

# CORS configuration - can be overridden by environment variable FRONTEND_URL
# For multiple origins, use comma-separated values
# Allow the Vite dev server (default localhost:8080) to call the backend during development.
# You can override by setting the FRONTEND_URL environment variable.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:8080}
