spring.application.name=GetJob
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Run backend on a non-conflicting port when running the Vite dev server on 8080
server.port=8081

# JWT configuration
jwt.secret=${JWT_SECRET}

# CORS configuration - can be overridden by environment variable
# For multiple origins, use comma-separated values without spaces
# MUST include: localhost (dev), Vercel frontend, Railway backend domains
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://getjobportal.vercel.app,https://*.vercel.app,https://getjob-production.up.railway.app,https://*.railway.app}
# Prefer setting the RapidAPI key via environment variable `RAPID_API_KEY`.
# You can also set `jsearch.api.key` directly here (not recommended for secrets).
jsearch.api.key=${RAPID_API_KEY:b2d573306dmsh94f1e8659ce9dbcp1ed860jsn85deba6d519f}
jsearch.api.host=${JSEARCH_API_HOST:jsearch.p.rapidapi.com}
# Optional: override the API URL used for scheduled or query fetches.
# Examples:
# - JSearch search endpoint: https://jsearch.p.rapidapi.com/search
# - Internships API example: https://internships-api.p.rapidapi.com/active-jb-7d
jsearch.api.url=https://jsearch.p.rapidapi.com/search