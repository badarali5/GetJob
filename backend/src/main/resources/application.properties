spring.application.name=GetJob
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Run backend on a non-conflicting port when running the Vite dev server on 8080
server.port=8081

# JWT configuration
jwt.secret=${JWT_SECRET}

# CORS configuration - can be overridden by environment variable FRONTEND_URL
# For multiple origins, use comma-separated values
# Allow the Vite dev server (default localhost:8080) to call the backend during development.
# You can override by setting the FRONTEND_URL environment variable.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,https://getjobportal.vercel.app}
# Prefer setting the RapidAPI key via environment variable `RAPID_API_KEY`.
# You can also set `jsearch.api.key` directly here (not recommended for secrets).
jsearch.api.key=${RAPID_API_KEY:b2d573306dmsh94f1e8659ce9dbcp1ed860jsn85deba6d519f}
jsearch.api.host=${JSEARCH_API_HOST:jsearch.p.rapidapi.com}
# Optional: override the API URL used for scheduled or query fetches.
# Examples:
# - JSearch search endpoint: https://jsearch.p.rapidapi.com/search
# - Internships API example: https://internships-api.p.rapidapi.com/active-jb-7d
jsearch.api.url=https://jsearch.p.rapidapi.com/search