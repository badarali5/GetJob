version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: getjob-postgres
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_URL##*/}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - getjob-network

  # Backend Service (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: getjob-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/getjobdb
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - getjob-network
    restart: unless-stopped

  # Frontend Service (React/Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: getjob-frontend
    environment:
      VITE_API_URL: http://localhost:8081
      RAPID_API_KEY: ${RAPID_API_KEY}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - getjob-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  getjob-network:
    driver: bridge
